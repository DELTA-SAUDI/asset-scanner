<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DELTA Asset Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    #result {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: right;
    }

    input {
      width: 90%;
      max-width: 350px;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      margin-top: 15px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>DELTA Asset Scanner</h1>

  <div id="reader"></div>

  <h3>أو أدخل كود الأصل يدويًا</h3>

  <input
    id="code"
    type="text"
    placeholder="مثال: FUR-0001"
  >

  <br>

  <button onclick="searchManual()">
    بحث
  </button>

  <div id="result">
    امسح الباركود أو أدخل الكود يدويًا
  </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwHWWJUQDvDUxFShoWWbHougyHjr0tFz3E38fX8e0bnTUpya-P0mXW_wF-RnIt6ClWV/exec";


function searchManual() {

  const code =
    document.getElementById("code").value.trim();

  if (!code) {
    alert("أدخل كود الأصل");
    return;
  }

  searchAsset(code);
}


function searchAsset(code) {

  document.getElementById("result").innerHTML =
    "<h3>جاري البحث...</h3>";

  fetch(API_URL + "?code=" + encodeURIComponent(code))
    .then(response => response.text())
    .then(data => {

      document.getElementById("result").innerHTML =
        "<pre>" + data + "</pre>";

    })
    .catch(error => {

      document.getElementById("result").innerHTML =
        "<h3>حدث خطأ</h3>" +
        "<p>" + error + "</p>";

    });
}


function onScanSuccess(decodedText) {

  document.getElementById("code").value =
    decodedText;

  searchAsset(decodedText);
}


function onScanFailure(error) {
  // تجاهل أخطاء البحث أثناء محاولة قراءة الباركود
}


const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 280,
        height: 160
      }
    },
    false
  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
